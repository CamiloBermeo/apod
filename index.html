<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apod</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="" class="logo">
      <h1>APOD</h1>
    </a>
    <a href="" class="favoritos">Favoritos</a>
  </header>

  <main id="main" class="main">
    <section class="calendario-vintage" aria-labelledby="titulo-calendario">
      <!-- Esquinas decorativas -->
      <span class="esquina esquina-superior" aria-hidden="true"></span>

      <span class="esquina esquina-inferior" aria-hidden="true"></span>

      <!-- Encabezado -->
      <header class="calendario-encabezado">
        <div>
          <p class="calendario-etiqueta">
            Consulta histórica
          </p>

          <h1 id="titulo-calendario">
            Selecciona la fecha
          </h1>
        </div>

        <span class="simbolo-celeste" aria-hidden="true">
          ✦
        </span>
      </header>

      <div class="linea-decorativa"></div>

      <!-- Formulario -->
      <form id="formulario-fecha" class="formulario-fecha">
        <div class="campo-fecha">
          <label for="fecha-apod">
            Fecha del registro
          </label>

          <input id="fecha-apod" name="fecha" type="date" min="1995-06-16" required />

          <small>
            Registros disponibles desde el 16 de junio de 1995.
          </small>
        </div>

        <button class="boton-descubrir" type="submit">
          <span>Descubrir el cielo</span>
          <span class="flecha" aria-hidden="true">→</span>
        </button>

        <button class="boton-hoy" id="boton-fecha-hoy" type="button">
          Consultar la imagen de hoy
        </button>
      </form>

      <!-- Estado -->
      <footer class="calendario-estado">
        <span class="estado-indicador" id="estado-indicador" aria-hidden="true"></span>

        <p id="mensaje-fecha" role="status" aria-live="polite">
          El archivo está listo para explorar.
        </p>
      </footer>
    </section>
    <section id="sectionInfo"></section>
  </main>

  <footer>
    <nav>
      <a href="">Inicio</a>
      <a href="">Favoritos</a>
      <a href="https://github.com/CamiloBermeo/apod" target="_blank">nuestro repositorio</a>
    </nav>
    <div>

      <p><strong>equipo de desarollo</strong></p>
      <ul>
        <br>
        <li>Angelica Garcia</li>
        <li>Camilo Bermeo</li>
        <li>Estefania</li>
        <li>Bryan Diaz</li>
      </ul>
    </div>

  </footer>

  <script src="app.js"></script>
</body>

</html>
